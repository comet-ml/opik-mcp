[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_redundant_casts = true
disallow_any_explicit = true     # the "no Any" rule, enforced
files = ["src", "tests", "scripts"]
# Skill `evals/` dirs hold dev-only harnesses and fixture apps that never ship in
# the pack; their entry points share module names mypy would reject.
exclude = ["/evals/"]

[[tool.mypy.overrides]]
module = ["mcp.shared.memory"]
ignore_missing_imports = true

# The agentskills.io reference library ships no py.typed marker.
[[tool.mypy.overrides]]
module = ["skills_ref", "skills_ref.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Raw backend JSON is the one place Any is honest. Type it once, at the edge.
module = ["opik_mcp.opik_client"]
disallow_any_explicit = false

# Baseline: modules that used explicit Any before the rule (OPIK-8485). Only
# shrinks: type a module, then delete its line. tests/repo/test_ratchets.py
# fails on a module that no longer uses explicit Any. Never add a line here.
