[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opik-mcp"
dynamic = ["version"]
description = "Model Context Protocol server for Opik (Comet's LLM observability platform)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Comet ML" }]
dependencies = [
    "mcp[cli]>=1.27,<2",
    "httpx>=0.28",
    "httpx-sse>=0.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "sentry-sdk>=2,<3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "anyio>=4.13",
    "asgi-lifespan>=2.1",
    "mypy>=1.13",
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.7",
    # Reference implementation of the agentskills.io spec. Used to validate the
    # authored skills and to read their frontmatter when building the published
    # pack, so our reading of a skill is identical to an agent's. Pinned to the
    # 0.1.x line: a behaviour change there changes what CI accepts and what ships.
    "skills-ref>=0.1.1,<0.2",
]

[project.scripts]
opik-mcp = "opik_mcp.__main__:main"

# The exact uv that CI runs. `setup-uv` reads this when no `version` is given,
# so the resolver in CI is the one the lockfile was written with.
[tool.uv]
required-version = "==0.11.7"

# The build version is computed, not read from a generated file:
# `scripts/_build_version.py` returns `$VERSION` when the release sets it, else
# `<version.txt>.dev0`, the same rule as `make version`. Reading the git-ignored
# `src/opik_mcp/_version.py` here made `uv lock` fail on a clean checkout, which
# is what Dependabot runs. The runtime still imports `_version.py`; `artifacts`
# keeps it in the wheel despite .gitignore once `make version` has written it.
[tool.hatch.version]
source = "code"
path = "scripts/_build_version.py"
expression = "get_version()"

[tool.hatch.build]
artifacts = ["src/opik_mcp/_version.py"]
# `evals/` holds fixture repositories and grading harnesses (OPIK-7800) that no
# agent reads and no code imports. `skills_catalog.EXCLUDED_DIRS` already keeps
# them off both MCP surfaces and out of the published pack — but nothing kept
# them out of the WHEEL, so they were about to reach every user's site-packages
# for the first time: 41 KB across 18 files, including runnable fixture scripts
# (`agent.py`, `seed.py`, `grader.py`). 0.2.24 shipped none of it only because
# the two skills that carry evals landed after it was tagged.
exclude = ["src/opik_mcp/skills/*/evals"]

[tool.hatch.build.targets.wheel]
packages = ["src/opik_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/version.txt", "/scripts/_build_version.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests/hermetic` spawns the server as a subprocess against a stub backend, so
# it is excluded from the default run — `make test` stays in-process and fast.
# It is NOT optional coverage: `make hermetic` and the `hermetic` CI job run it
# on every PR, because it is the only per-PR suite that exercises `__main__`'s
# startup path.
# `live` and `user_flows` need a real backend (and, for user_flows, a model key),
# so they are deselected the same way and run only through their make targets.
# `slow` tests spawn a subprocess each; they are deselected too and run by
# `make slow`, which CI runs in python-checks right after `make check`.
addopts = "-m 'not hermetic and not live and not user_flows and not slow'"
markers = [
    "hermetic: `python -m opik_mcp` over stdio or HTTP against a stub backend; run by `make hermetic`",
    "live: drives the server against a seeded local Opik backend; run by `make live`",
    "user_flows: a real agent on the real server, answers judged; run by `make user-flows`",
    "slow: spawns a subprocess (hooks, scripts, git, make, ruff, mypy); run by `make slow` and its CI step",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]


[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # isort; I002 adds the required future import
    "UP",            # pyupgrade
    "B",             # bugbear; B904 = raise ... from
    "SIM",           # simplify
    "RUF",           # ruff rules; RUF100 = unused noqa
    "T20",           # no print in the package
    "PLC0415",       # imports at the top
    "TID252",        # absolute imports only
    "ERA",           # no commented-out code
    "FBT",           # boolean positional args -> keyword-only
    "PT",            # pytest style
    "ARG",           # unused arguments
    "C4",            # comprehensions
    "PERF",          # perf anti-patterns
    "RET",           # return consistency
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-boolean-trap]
extend-allowed-calls = ["pytest.param"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T20"]          # printing is their output
".claude/hooks/**" = ["T20"]
"src/opik_mcp/_version.py" = ["I002"]  # generated
"tests/**" = ["PLC0415", "ARG001", "FBT"]  # fixtures and lazy imports are the idiom

