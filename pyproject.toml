[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opik-mcp"
dynamic = ["version"]
description = "Model Context Protocol server for Opik (Comet's LLM observability platform)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Comet ML" }]
dependencies = [
    "mcp[cli]>=1.27,<2",
    "httpx>=0.28",
    "httpx-sse>=0.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "sentry-sdk>=2,<3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "anyio>=4.13",
    "asgi-lifespan>=2.1",
    "mypy>=1.13",
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.7",
]

[project.scripts]
opik-mcp = "opik_mcp.__main__:main"

# Version comes from a generated, git-ignored file (`make version` / CI writes it;
# version.txt holds only MAJOR.MINOR). `artifacts` force-includes it in the
# sdist/wheel despite .gitignore, so building from an sdist resolves the version.
[tool.hatch.version]
path = "src/opik_mcp/_version.py"

[tool.hatch.build]
artifacts = ["src/opik_mcp/_version.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/opik_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The MCP App is a document, not code: `assets.py` is a generated base64 data URI
# and `review_html.py` holds the HTML/CSS/JS verbatim. Line length carries no
# meaning in either, and reflowing them would corrupt the asset.
"src/opik_mcp/apps/assets.py" = ["E501"]
# RUF001: the en dashes are deliberate typography in the UI copy.
"src/opik_mcp/apps/review_html.py" = ["E501", "RUF001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_redundant_casts = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["mcp.shared.memory"]
ignore_missing_imports = true
