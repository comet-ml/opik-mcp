# Test cases for the `/opik-verify` skill.
#
#   triggering  -> does the skill load for the DECISION and stay out of compare's way?
#   functional  -> given a seeded suite with a baseline and known candidates, does it
#                  return the planted verdict with every criterion shown?
#   edge        -> the human-review gate and the evidence floor behave per the contract.
#
# The fixture is a seeder (fixtures/gate/seed.py) that creates a 12-item suite and runs a
# baseline plus two candidates whose verdicts are known: `ship` (everything fixed) and
# `hold` (support-hours items regress). Each case gets its own workdir with the policy
# file adjusted (`policy` below). The grader scores result.json against planted.json.

triggering:
  should_trigger:
    - "is this safe to ship"
    - "can I merge this"
    - "go/no-go on this change"
    - "gate this release"
    - "should I roll this out"
    - "does this pass our release policy"
  should_not_trigger:
    - "did my fix work"                            # compare
    - "which cases regressed"                      # compare
    - "compare these two experiments"              # compare
    - "build an evaluation for my agent"           # evaluate
    - "turn this trace into a test"                # test
    - "deploy this to production"                  # not a skill
    - "what's the weather in San Francisco"        # none

functional:
  - id: ship
    fixture: gate
    candidate: ship
    policy: {judge_validated: true}
    prompt: "Is candidate <CANDIDATE> safe to ship? Baseline is <BASELINE> on suite <SUITE>; the policy is opik-release-policy.yaml in this directory."
    expect_status: ship
    assert:
      status: ship
      criteria_complete: true          # every criterion named in the policy appears in `criteria`
      no_regressions_listed: true
      compare_url_has_both_ids: true
      policy_source: file
      one_next_step: true
      no_modifications: true

  - id: hold
    fixture: gate
    candidate: hold
    policy: {judge_validated: true}
    prompt: "Is candidate <CANDIDATE> safe to ship? Baseline is <BASELINE> on suite <SUITE>; the policy is opik-release-policy.yaml in this directory."
    expect_status: hold
    assert:
      status: hold
      criteria_complete: true
      regressions_include_roles: [hours]           # both hours items flipped pass -> fail
      regressions_exclude_roles: [refund, shipping, legal]
      failed_criteria_include: [regressions]
      compare_url_has_both_ids: true
      one_next_step: true
      no_modifications: true

edge:
  - id: review
    fixture: gate
    candidate: ship
    policy: {judge_validated: false}
    prompt: "Is candidate <CANDIDATE> safe to ship? Baseline is <BASELINE> on suite <SUITE>; the policy is opik-release-policy.yaml in this directory."
    expect_status: needs_review
    assert:
      status: needs_review
      criteria_complete: true
      no_regressions_listed: true
      one_next_step: true
      no_modifications: true

  - id: too_small
    fixture: gate
    candidate: ship
    policy: {judge_validated: true, min_items: 50}
    prompt: "Is candidate <CANDIDATE> safe to ship? Baseline is <BASELINE> on suite <SUITE>; the policy is opik-release-policy.yaml in this directory."
    expect_status: insufficient_evidence
    assert:
      status: insufficient_evidence
      criteria_complete: true
      failed_criteria_include: [min_items]
      one_next_step: true
      no_modifications: true
