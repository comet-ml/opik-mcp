# Test cases for the `/opik-optimize` skill.
#
#   triggering  -> does the skill load at the right times (change the prompt vs measure it)?
#   functional  -> given a weak library prompt + a dataset with expected outputs, does it report
#                  a VALIDATION gain, the run link, the cost, bound the budget, and save a new
#                  version only on a real improvement — without touching the repo?
#
# The fixture is a seeder (fixtures/format/seed.py): 50 order-line items whose expected
# output is a strict format ("TOTAL: 41.50") the weak prompt never mentions, so the
# prompt IS the bottleneck and a real gain is available. The grader scores result.json
# against planted.json; `verify` (network) checks the prompt library: a new version
# exists iff the result says `improved`.

triggering:
  should_trigger:
    - "optimize this prompt"
    - "improve my system prompt"
    - "tune the prompt against my dataset"
    - "run the prompt optimizer"
    - "make the agent answer better using my eval data"
    - "can the optimizer find a better few-shot prompt"
  should_not_trigger:
    - "evaluate my agent"                          # evaluate
    - "how good is my agent right now"             # evaluate
    - "did my fix work"                            # compare
    - "turn this trace into a test"                # test
    - "why did this trace fail"                    # explain
    - "score production traces"                    # online-eval
    - "what's the weather in San Francisco"        # none

functional:
  - id: library_prompt
    fixture: format
    prompt: "Optimize the library prompt <PROMPT> against dataset <DATASET> (project <PROJECT>). Items have `input` and `expected_output`."
    expect_status: improved
    assert:
      status_in: [improved, no_improvement]   # honest either way
      validation_reported: true               # scores.validation present (not just training)
      run_url_present: true
      cost_reported: true                     # cost key present (value may be null when the provider gives none)
      budget_bounded: true                    # optimizer.n_samples and optimizer.max_trials set
      split_reported: true                    # dataset.train and dataset.validation with counts; validation >= 10
      version_saved_iff_improved: true        # prompt.new_version set <=> status == improved
      prompt_matches_planted: true            # prompt.name == the seeded library prompt
      one_next_step: true
      no_modifications: true                  # nothing in the workdir changed
