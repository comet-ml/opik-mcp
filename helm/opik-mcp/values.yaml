nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  registry: ghcr.io
  repository: comet-ml/opik-mcp
  pullPolicy: IfNotPresent
  tag: "main"

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Example AWS IRSA:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/opik-mcp

service:
  type: ClusterIP
  port: 8080

# SSE streams stay open up to ~30 min; give the pod time to drain on SIGTERM.
# tini (PID 1, in the image) forwards SIGTERM to uvicorn promptly.
terminationGracePeriodSeconds: 60

# /health = liveness (process only, no upstream calls);
# /health/ready = readiness + startup (probes comet-backend reachability).
livenessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  periodSeconds: 10
startupProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 12

# ~1 vCPU / 512 MiB supports ~1000 concurrent SSE streams per replica.
resources:
  requests:
    cpu: "1"
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1Gi

# Hosted-server runtime. The image defaults OPIK_MCP_TRANSPORT=http already;
# set explicitly here so the chart is self-documenting.
#
# Backend URLs are read from config.py settings COMET_URL_OVERRIDE / OPIK_URL.
# (A future code change may add OPIK_MCP_COMET_BACKEND_URL /
# OPIK_MCP_OPIK_BACKEND_URL aliases — revisit here if so.)
env:
  OPIK_MCP_TRANSPORT: "http"
  OPIK_MCP_HOST: "0.0.0.0"
  OPIK_MCP_PORT: "8080"
  OPIK_MCP_LOG_LEVEL: "INFO"
  # ask_ollie is OFF everywhere, hosted included. The code default is already
  # "disabled"; set explicitly here so the chart states the decision rather than
  # leaving it to be inferred from an absent key.
  #
  # Hosted is not an exception, and could not have been: ask_ollie requires a
  # static OPIK_API_KEY (config.require_ollie_config) and never reads the inbound
  # credential, so on an OAuth deployment every call died at the config check —
  # 31 of 34 hosted calls, one install, steadily over four weeks. Enabling it
  # here would have advertised a tool that cannot work.
  #
  # Do NOT "fix" that by setting OPIK_API_KEY on this deployment: it would route
  # every user's Ollie session through one operator credential, which is a
  # tenancy and attribution problem, not a fix.
  #
  # Flipping this to "enabled" restores the tool without a code change, and
  # should wait until the mid-stream pod failures are fixed — the best-configured
  # cohort measured 37/170 (16%) with 122 PodErrorEventError.
  OPIK_MCP_ASK_OLLIE: "disabled"
  # COMET_URL_OVERRIDE: "https://www.comet.com"
  # OPIK_URL: ""

ingress:
  enabled: false
  ingressClassName: ""
  annotations: {}
  #   # Long-idle SSE: no edge buffering, >=1800s read timeout.
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
  #   nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts: []
  #   - host: www.comet.com
  #     paths:
  #       - path: /api/v1/mcp
  #         pathType: Prefix
  #       - path: /.well-known/oauth-protected-resource
  #         pathType: Prefix
  tls: []

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
