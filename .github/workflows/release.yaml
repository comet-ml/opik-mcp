name: Release
run-name: "Release by @${{ github.actor }}"

# Manual release. THIS WORKFLOW CREATES THE TAG — nothing else in the repo does.
#
# The version comes from `version.txt` (x.y.z, the pending release), so there is
# no version to type and no wrong tag to pick. The tag is created here at the
# commit being released, the image built from that commit is promoted, the chart
# and PyPI package are published, the GitHub release is created, and finally
# `version.txt` is bumped on main for the next cycle. Mirrors comet-ml/opik.
#
# Consequence, which is the point: a git tag exists only for a released version,
# so tags, GitHub releases and PyPI versions are one set rather than three that
# drift. (Before this, main builds tagged every merge and 0.2.25-0.2.27 were
# tagged but never released.)
#
# ORDERING. The tag is created FIRST, because the chart and PyPI jobs build from
# `refs/tags/<version>` and a release must be reproducible from a ref. If a later
# job fails, re-run with `reuse_existing_tag: true` rather than deleting the tag.

on:
  workflow_dispatch:
    inputs:
      reuse_existing_tag:
        type: boolean
        required: false
        default: false
        description: "Reuse the existing tag for version.txt instead of creating it. Use to replay a release whose tag was already pushed by a failed run."

permissions:
  contents: write   # create the GitHub release
  id-token: write   # PyPI Trusted Publishing
  packages: write   # retag image + push chart to GHCR

env:
  IMAGE: ghcr.io/comet-ml/opik-mcp

jobs:

  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      sha_tag: ${{ steps.v.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Read version.txt and pin the commit being released
        id: v
        run: |
          set -euo pipefail
          VERSION=$(tr -d ' \t\r\n' < version.txt)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version.txt must be MAJOR.MINOR.PATCH (x.y.z), got '$VERSION'"; exit 1
          fi

          # Pin the SHA once, here. Every later job resolves from this rather
          # than from `main`, so a merge landing mid-release cannot make the tag,
          # the image and the wheel come from three different commits.
          #
          # ON A REPLAY THE TAG WINS, not main. A replay finishes a release that
          # already tagged and published from an earlier commit; main has almost
          # certainly moved on by then (very likely to the fix that made the
          # replay necessary). Taking main's HEAD would promote an image built
          # from the WRONG commit and stamp the released version on it, leaving
          # the tag, the wheel and the image disagreeing about what 0.x.y is.
          EXISTING_TAG_SHA=$(git ls-remote --tags origin "refs/tags/$VERSION" | awk '{print $1}')
          if [ -n "$EXISTING_TAG_SHA" ]; then
            git fetch --depth=1 origin "refs/tags/$VERSION" >/dev/null 2>&1 || true
            SHA=$(git rev-parse "refs/tags/$VERSION^{commit}" 2>/dev/null || echo "$EXISTING_TAG_SHA")
            echo "::notice title=validate::$VERSION is already tagged; releasing that commit (${SHA:0:12}), not main."
          else
            SHA=$(git rev-parse HEAD)
          fi
          echo "version=$VERSION" | tee -a "$GITHUB_OUTPUT"
          echo "sha=$SHA" | tee -a "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${SHA:0:12}" | tee -a "$GITHUB_OUTPUT"
          echo "### Releasing $VERSION from ${SHA:0:12}" >> "$GITHUB_STEP_SUMMARY"

  create-git-tag:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - name: Create and push the release tag
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          REUSE: ${{ inputs.reuse_existing_tag }}
        run: |
          set -euo pipefail
          EXISTING=$(git ls-remote --tags origin "refs/tags/$VERSION" | awk '{print $1}')

          if [ "$REUSE" = "true" ]; then
            if [ -n "$EXISTING" ]; then
              echo "::warning title=create-git-tag::reusing existing tag $VERSION at $EXISTING — verify that is the commit you mean to release."
              exit 0
            fi
            echo "::error::reuse_existing_tag=true but origin has no tag $VERSION. Refusing to create one silently."
            exit 1
          fi

          if [ -n "$EXISTING" ]; then
            echo "::error::tag $VERSION already exists at $EXISTING — version.txt was not bumped after the last release. Bump it, or re-run with reuse_existing_tag to replay."
            exit 1
          fi

          git config --local user.email "github-actions@comet.com"
          git config --local user.name "github-actions"
          git tag "$VERSION"
          git push --no-verify origin "refs/tags/$VERSION"

  promote-image:
    needs: [validate, create-git-tag]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Promotes the image CI built for this exact commit. No rebuild, so the
      # released digest is provably the one that passed CI on that commit.
      # WAITS for the image rather than requiring the operator to time the
      # release. Releasing right after a merge is the normal thing to do, and
      # the multi-arch build takes ~75s — 0.2.28 failed by looking 35s too
      # early. Ten minutes covers a cold cache; the failure message still names
      # the cause if CI genuinely did not run.
      - name: Wait for the commit's image, then promote it to :x.y.z and :latest
        env:
          SHA_TAG: ${{ needs.validate.outputs.sha_tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 600 ))
          until docker buildx imagetools inspect "${IMAGE}:${SHA_TAG}" >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::${IMAGE}:${SHA_TAG} never appeared after 10 minutes. Check the CI run for this commit, then re-run this workflow with reuse_existing_tag: true."
              exit 1
            fi
            echo "waiting for ${IMAGE}:${SHA_TAG} (main's build-image is probably still running)…"
            sleep 20
          done
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${SHA_TAG}"
          echo "### Image: \`${IMAGE}:${SHA_TAG}\` → \`:${VERSION}\`, \`:latest\`" >> "$GITHUB_STEP_SUMMARY"

  publish-chart:
    needs: [validate, create-git-tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Package + push chart to GHCR (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package helm/opik-mcp \
            --version "${{ needs.validate.outputs.version }}" \
            --app-version "${{ needs.validate.outputs.version }}"
          helm push "opik-mcp-${{ needs.validate.outputs.version }}.tgz" oci://ghcr.io/comet-ml/charts
          echo "### Chart: \`oci://ghcr.io/comet-ml/charts/opik-mcp:${{ needs.validate.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"

  pypi:
    needs: [validate, create-git-tag]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: astral-sh/setup-uv@v6
      - name: Stamp the release version + build
        run: |
          VERSION="${{ needs.validate.outputs.version }}" make version
          uv build
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A PyPI version can be uploaded exactly once, so without this a
          # REPLAY (`reuse_existing_tag: true`, after a later job failed) dies
          # here on a duplicate and skips the very jobs it was re-run to
          # finish. That happened on 0.2.28: PyPI succeeded, promote-image lost
          # a race, and the recovery path could not get past this step.
          # `skip-existing` makes the upload idempotent — a replay confirms the
          # version is published rather than failing because it is.
          skip-existing: true
      - name: Summary
        run: |
          echo "### PyPI: \`opik-mcp ${{ needs.validate.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [validate, create-git-tag, promote-image, publish-chart, pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      # Replay-safe, for the same reason as `skip-existing` on the PyPI upload:
      # a re-run exists to finish a release, so a step that already succeeded
      # must be a no-op rather than the thing that stops it finishing.
      - name: Create GitHub release for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::notice title=github-release::release $VERSION already exists; leaving it as is."
          else
            gh release create "$VERSION" --title "$VERSION" --generate-notes
          fi
          echo "### Release: [\`${{ needs.validate.outputs.version }}\`](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.version }})" >> "$GITHUB_STEP_SUMMARY"

      # Remove the rolling draft maintained by release-drafter now that a real
      # release exists, so the next cycle starts a fresh draft.
      - name: Delete leftover release draft(s)
        uses: hugo19941994/delete-draft-releases@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Closes the loop: version.txt always names an UNRELEASED version, so the next
  # release has nothing to type and cannot collide with a published one. Runs
  # last and only on success — bumping after a failed release would strand the
  # version that failed, with no tag and no way to retry it by name.
  bump-version:
    needs: [validate, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Bump the patch on main
        env:
          RELEASED: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          CURRENT=$(tr -d ' \t\r\n' < version.txt)
          if [ "$CURRENT" != "$RELEASED" ]; then
            # Someone bumped it by hand mid-release, or main moved. Their value
            # wins: overwriting it could silently re-release a version.
            echo "::warning title=bump-version::version.txt is $CURRENT, not the released $RELEASED — leaving it alone."
            exit 0
          fi
          NEXT="${RELEASED%.*}.$(( ${RELEASED##*.} + 1 ))"
          printf '%s\n' "$NEXT" > version.txt
          git config --local user.email "github-actions@comet.com"
          git config --local user.name "github-actions"
          git add version.txt
          git commit -m "Bump version.txt to $NEXT after releasing $RELEASED"
          git push origin main
          echo "### Next version: \`$NEXT\` (was \`$RELEASED\`)" >> "$GITHUB_STEP_SUMMARY"
